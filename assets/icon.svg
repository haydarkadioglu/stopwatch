<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141827" />
      <stop offset="100%" stop-color="#090b10" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" />
  <!-- Top crown -->
  <rect x="232" y="64" width="48" height="22" rx="10" fill="url(#accent)" />
  <!-- Outer track -->
  <circle cx="256" cy="272" r="154" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="20" />
  <!-- Progress arc -->
  <circle
    cx="256"
    cy="272"
    r="154"
    fill="none"
    stroke="url(#accent)"
    stroke-width="20"
    stroke-linecap="round"
    stroke-dasharray="680 968"
    transform="rotate(-90 256 272)"
  />
  <!-- Clock hands -->
  <line x1="256" y1="272" x2="256" y2="176" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" />
  <line x1="256" y1="272" x2="326" y2="306" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" />
  <circle cx="256" cy="272" r="16" fill="#f8fafc" />
</svg>
